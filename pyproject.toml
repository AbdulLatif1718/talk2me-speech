[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "talk2me-speech"
version = "0.1.0"
description = "Speech recognition pipelines for multilingual and Ghanaian datasets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Talk2Me AI" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "soundfile>=0.12",
  "torchaudio>=2.2",
  "torch>=2.2",
  "transformers>=4.41",
  "datasets>=2.18",
  "tokenizers>=0.19",
  "librosa>=0.10",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.optional-dependencies]
dev = [
  "black>=24.0",
  "ruff>=0.4",
  "mypy>=1.10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
