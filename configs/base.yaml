dataset:
  name: default
  # language: null  # Leave null for multilingual; set to 'en', 'tw', 'ha', etc. for single language
  sampling_rate: 16000

model:
  name: whisper-small
  cache_dir: ./models

training:
  epochs: 5
  batch_size: 8
  learning_rate: 5e-5
  output_dir: ./models/checkpoints

inference:
  device: cuda  # 'cuda' or 'cpu'
  fp16: true  # Use mixed precision
  # Note: Do NOT force language globally; set language-specific configs in model configs
